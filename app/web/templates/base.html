<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life OS v1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.0.18/index.css"
    />
    <style>
      body {
        font-family: "Space Grotesk", ui-sans-serif, system-ui;
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-900">
    <div class="min-h-screen flex">
      <aside
        id="sidebar"
        class="bg-white w-64 border-r border-slate-200 hidden md:flex flex-col"
      >
        <div class="px-6 py-5 text-xl font-semibold">Life OS</div>
        <nav class="flex-1 px-4 space-y-2 text-sm">
          <a class="block px-3 py-2 rounded hover:bg-slate-100" href="/dashboard">Dashboard</a>
          <a class="block px-3 py-2 rounded hover:bg-slate-100" href="/goals">Goals</a>
          <a class="block px-3 py-2 rounded hover:bg-slate-100" href="/plans">Plans</a>
          <a class="block px-3 py-2 rounded hover:bg-slate-100" href="/logs">Logs</a>
          <a class="block px-3 py-2 rounded hover:bg-slate-100" href="/reviews">Reviews</a>
          <a class="block px-3 py-2 rounded hover:bg-slate-100" href="/settings">Settings</a>
        </nav>
        <div class="px-4 py-4 text-xs text-slate-500">Local-first Life OS v1</div>
      </aside>
      <div class="flex-1 flex flex-col">
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <button
              class="md:hidden inline-flex items-center justify-center rounded border border-slate-300 px-2 py-1 text-sm"
              onclick="document.getElementById('sidebar').classList.toggle('hidden')"
            >
              Menu
            </button>
            <div class="font-semibold text-lg">{% block page_title %}{% endblock %}</div>
          </div>
          <div class="text-sm text-slate-500">Life OS v1</div>
        </header>
        <main class="flex-1 px-6 py-6">
          <div class="mx-auto w-full max-w-6xl">{% block content %}{% endblock %}</div>
        </main>
      </div>
    </div>

    <div id="hx-indicator" class="fixed inset-0 hidden items-center justify-center bg-slate-900/30">
      <div class="bg-white px-4 py-3 rounded shadow text-sm">Loading...</div>
    </div>
    <script>
      document.body.addEventListener("htmx:beforeRequest", function () {
        document.getElementById("hx-indicator").classList.remove("hidden");
      });
      document.body.addEventListener("htmx:afterRequest", function () {
        document.getElementById("hx-indicator").classList.add("hidden");
      });
    </script>
  </body>
</html>
