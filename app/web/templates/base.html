      const LOCALE_KEY = "lifeos.locale";
      const defaultLocale = "zh";
      let currentLocale = localStorage.getItem(LOCALE_KEY) || defaultLocale;

      function getDictValue(dict, key) {
        return key.split(".").reduce((acc, part) => (acc && acc[part] ? acc[part] : null), dict);
      }

      function resolveParams(params) {
        const resolved = {};
        Object.entries(params).forEach(([key, value]) => {
          if (key.endsWith("Key")) {
            const targetKey = key.slice(0, -3);
            resolved[targetKey] = t(value);
            return;
          }
          if (typeof value === "string" && value.startsWith("i18n:")) {
            resolved[key] = t(value.slice(5));
            return;
          }
          if (value && typeof value === "object") {
            resolved[key] = JSON.stringify(value);
            return;
          }
          resolved[key] = value;
        });
        return resolved;
      }

      function t(key, params = {}) {
        const dict = I18N[currentLocale] || {};
        let text = getDictValue(dict, key);
        if (!text) {
          return key;
        }
        if (typeof text !== "string") {
          return key;
        }
        const resolvedParams = resolveParams(params);
        return text.replace(/\{(\w+)\}/g, (match, paramKey) =>
          resolvedParams[paramKey] !== undefined ? resolvedParams[paramKey] : match
        );
      }

      function parseParams(raw) {
        if (!raw) return {};
        try {
          return JSON.parse(raw);
        } catch {
          return {};
        }
      }

      function applyTranslations(root = document) {
        root.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (!key) return;
          const params = parseParams(el.getAttribute("data-i18n-params"));
          el.textContent = t(key, params);
        });
        root.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          const key = el.getAttribute("data-i18n-placeholder");
          if (!key) return;
          const params = parseParams(el.getAttribute("data-i18n-params"));
          el.setAttribute("placeholder", t(key, params));
        });
        root.querySelectorAll("[data-i18n-title]").forEach((el) => {
          const key = el.getAttribute("data-i18n-title");
          if (!key) return;
          const params = parseParams(el.getAttribute("data-i18n-params"));
          el.setAttribute("title", t(key, params));
        });
        root.querySelectorAll("[data-i18n-value]").forEach((el) => {
          const key = el.getAttribute("data-i18n-value");
          if (!key) return;
          const params = parseParams(el.getAttribute("data-i18n-params"));
          el.setAttribute("value", t(key, params));
        });
        root.querySelectorAll("[data-i18n-attrs]").forEach((el) => {
          const raw = el.getAttribute("data-i18n-attrs");
          if (!raw) return;
          const attrs = parseParams(raw);
          Object.entries(attrs).forEach(([attrName, payload]) => {
            if (!payload || !payload.key) return;
            el.setAttribute(attrName, t(payload.key, payload.params || {}));
          });
        });
        document.documentElement.setAttribute("lang", currentLocale);
        document.title = t("common.app_version");
        document.querySelectorAll("[data-lang]").forEach((btn) => {
          btn.classList.toggle(
            "bg-slate-900 text-white",
            btn.getAttribute("data-lang") === currentLocale
          );
        });
      }

      function emojiForProgress(progress) {
        if (progress >= 100) return "\u{1F601}";
        if (progress >= 60) return "\u{1F60A}";
        if (progress >= 20) return "\u{1F4AA}";
        return "\u{1F61E}";
      }

      function emojiForPlan(progress) {
        if (progress >= 100) return "\u{1F603}";
        if (progress >= 50) return "\u{1F4AA}";
        return "\u{1F61E}";
      }

      function emojiForLog(status) {
        return status === "recorded" ? "\u{1F604}" : "\u{1F61E}";
      }

      function applyEmoji(root = document) {
        root.querySelectorAll("[data-emoji]").forEach((el) => {
          el.classList.add("emoji");
          const mode = el.getAttribute("data-emoji-mode");
          if (mode === "log") {
            const status = el.getAttribute("data-status") || "";
            el.textContent = emojiForLog(status);
            return;
          }
          const raw = el.getAttribute("data-progress");
          const progress = raw ? parseFloat(raw) : 0;
          if (mode === "plan") {
            el.textContent = emojiForPlan(progress);
          } else {
            el.textContent = emojiForProgress(progress);
          }
        });
      }

      document.body.addEventListener("htmx:beforeRequest", function () {
        document.getElementById("hx-indicator").classList.remove("hidden");
      });
      document.body.addEventListener("htmx:afterRequest", function () {
        document.getElementById("hx-indicator").classList.add("hidden");
      });
      document.body.addEventListener("htmx:afterSwap", function (event) {
        applyTranslations(event.target);
        applyEmoji(event.target);
      });
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll("[data-lang]").forEach((btn) => {
          btn.addEventListener("click", function () {
            const nextLocale = btn.getAttribute("data-lang");
            if (!nextLocale) return;
            currentLocale = nextLocale;
            localStorage.setItem(LOCALE_KEY, currentLocale);
            applyTranslations(document);
            applyEmoji(document);
          });
        });
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            if (mutation.type === "childList") {
              mutation.addedNodes.forEach((node) => {
                if (node.nodeType === 1) {
                  applyEmoji(node);
                }
              });
            } else if (mutation.type === "attributes") {
              const target = mutation.target;
              if (target && target.nodeType === 1) {
                applyEmoji(target);
              }
            }
          });
        });
        observer.observe(document.body, {
          subtree: true,
          childList: true,
          attributes: true,
          attributeFilter: ["data-emoji", "data-emoji-mode", "data-progress", "data-status"],
        });
        applyTranslations(document);
        applyEmoji(document);
      });
