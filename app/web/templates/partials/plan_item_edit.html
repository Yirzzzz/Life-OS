<div class="plan-item border border-slate-200 rounded px-3 py-2 text-sm">
  <form
    class="space-y-2"
    hx-post="/plans/items/{{ item.id }}/edit"
    hx-target="closest .plan-item"
    hx-swap="outerHTML"
  >
    <input class="w-full border rounded px-2 py-1 text-sm" name="title" value="{{ item.title }}" required />
    <select class="w-full border rounded px-2 py-1 text-sm" name="linked_goal_id" {% if objective %}required{% endif %}>
      <option value="" {% if not item.linked_goal_id %}selected{% endif %}{% if objective %} disabled{% endif %}>Select goal</option>
      {% for goal in goals %}
        <option value="{{ goal.id }}" {% if item.linked_goal_id == goal.id %}selected{% endif %}>{{ goal.title }}</option>
      {% endfor %}
    </select>
    {% if objective %}
      <input
        class="w-full border rounded px-2 py-1 text-sm"
        type="date"
        name="due_date"
        value="{{ objective.due_date }}"
        required
      />
      <select class="w-full border rounded px-2 py-1 text-sm" name="status">
        <option value="pending" {% if objective.status == 'pending' %}selected{% endif %}>pending</option>
        <option value="completed" {% if objective.status == 'completed' %}selected{% endif %}>completed</option>
        <option value="expired" {% if objective.status == 'expired' %}selected{% endif %}>expired</option>
      </select>
    {% endif %}
    <input class="w-full border rounded px-2 py-1 text-sm" name="note" value="{{ item.note }}" placeholder="Note" />
    <div class="flex items-center gap-2">
      <button class="flex-1 bg-slate-900 text-white py-1 rounded">Save</button>
      <button
        type="button"
        class="px-3 py-1 border rounded"
        hx-get="/plans/items/{{ item.id }}"
        hx-target="closest .plan-item"
        hx-swap="outerHTML"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
