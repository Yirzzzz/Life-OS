<div class="overflow-x-auto">
  <table class="min-w-full text-sm">
    <thead class="text-left text-slate-500">
      <tr>
        <th class="py-2 pr-4" data-i18n="log_table.date"></th>
        <th class="py-2 pr-4" data-i18n="log_table.summary"></th>
        <th class="py-2 pr-4" data-i18n="log_table.tags"></th>
        <th class="py-2" data-i18n="log_table.actions"></th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-100">
      {% for log in logs %}
        <tr>
          <td class="py-2 pr-4">{{ log.date }}</td>
          <td class="py-2 pr-4">
            {% for entry in log.period_entries %}
              <div class="text-xs text-slate-600">
                <span data-i18n="{{ period_labels.get(entry.period, entry.period) }}"></span>: {{ entry.text[:30] }}
              </div>
            {% endfor %}
          </td>
          <td class="py-2 pr-4 text-xs text-slate-500">{{ log.tags|join(", ") }}</td>
          <td class="py-2">
            <a class="text-blue-600 text-xs" href="/logs?target_date={{ log.date }}" data-i18n="log_table.view"></a>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% if not logs %}
  <div class="text-sm text-slate-500" data-i18n="log_table.empty"></div>
{% endif %}
