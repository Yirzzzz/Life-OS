<div class="plan-item flex items-center justify-between border border-slate-200 rounded px-3 py-2 text-sm">
  <div class="flex-1">
    <div class="{% if item.completed_at %}line-through text-slate-400{% endif %}">{{ item.title }}</div>
    {% if item.note %}
      <div class="mt-1 text-xs text-slate-500">{{ item.note }}</div>
    {% endif %}
  </div>
  <div class="flex items-center gap-2">
  <form
    hx-post="/plans/items/{{ item.id }}/toggle"
    hx-target="closest .plan-item"
    hx-swap="outerHTML"
  >
    <input type="hidden" name="completed" value="{{ false if item.completed_at else true }}" />
    <button
      class="text-xs px-3 py-1 border rounded {% if item.completed_at %}bg-emerald-50{% endif %}"
      data-i18n="{{ 'plan_item.mark_incomplete' if item.completed_at else 'plan_item.mark_complete' }}"
    ></button>
  </form>
    <button
      class="text-xs px-3 py-1 border rounded"
      hx-get="/plans/items/{{ item.id }}/edit"
      hx-target="closest .plan-item"
      hx-swap="outerHTML"
      data-i18n="common.edit"
    ></button>
    {% set confirm_key = 'plan_item.confirm_delete_habit' if item.linked_habit_id else 'plan_item.confirm_delete_plan' %}
    <button
      class="text-xs px-3 py-1 border rounded text-rose-600 border-rose-200"
      hx-post="{% if item.linked_habit_id %}/habits/{{ item.linked_habit_id }}/delete{% else %}/plans/items/{{ item.id }}/delete{% endif %}"
      hx-target="closest .plan-item"
      hx-swap="outerHTML"
      data-i18n="{{ 'plan_item.delete_habit' if item.linked_habit_id else 'common.delete' }}"
      data-i18n-attrs='{{ {"hx-confirm": {"key": confirm_key, "params": {"title": item.title}}} | tojson }}'
    ></button>
  </div>
</div>
